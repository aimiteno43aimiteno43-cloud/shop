<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>つまみ細工 商品ページ</title>

<p><a href="concept.html">コンセプトを見る</a></p>
  
<style>
body {
font-family: "Yu Mincho", serif;
color: #59200d;
text-align: center;
margin: 0;
padding: 20px;

background-color: #f8f4ee;
background-image:
linear-gradient(30deg, #e6ddd2 12%, transparent 12.5%, transparent 87%, #e6ddd2 87.5%, #e6ddd2),
linear-gradient(150deg, #e6ddd2 12%, transparent 12.5%, transparent 87%, #e6ddd2 87.5%, #e6ddd2),
linear-gradient(90deg, #efe7dc 2%, transparent 2.5%, transparent 97%, #efe7dc 97.5%);
background-size: 80px 140px;
}


h1 {
margin-top: 20px;
}

/* 商品一覧 */
.container {
display: grid;
grid-template-columns: repeat(3, 250px);
gap: 40px;
justify-content: center;
margin-top: 30px;
}

/* スマホ */
@media (max-width: 768px) {

body {
padding: 8px;
}

h1 {
font-size: 24px;
margin-top: 10px;
margin-bottom: 15px;
}

p {
font-size: 14px;
line-height: 1.6;
}

/* 商品一覧 */
.container {
grid-template-columns: repeat(2, 155px);
gap: 12px;
justify-content: center;
margin-top: 15px;
}

/* 商品カード */
.product {
padding: 10px;
border-radius: 10px;
}

.product img {
width: 100%;
border-radius: 8px;
}

.product p {
font-size: 13px;
margin: 6px 0;
}

.price {
font-size: 16px;
}

/* ボタン */
.product button {
font-size: 13px;
padding: 8px;
margin-top: 6px;
}

/* カート */
#cartArea {
width: 95%;
padding: 15px;
margin-top: 15px;
}

.cart-item {
gap: 10px;
padding: 10px 0;
}

.cart-item img {
width: 65px;
}

.cart-info {
font-size: 13px;
}

.qty button {
width: 28px;
height: 28px;
font-size: 14px;
}

.total-box {
font-size: 16px;
text-align: right;
}

.reset-btn {
width: 95%;
padding: 10px;
font-size: 14px;
}
}

/* 商品カード */
.product {
background: white;
padding: 20px;
border-radius: 12px;
box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

.product img {
width: 100%;
border-radius: 10px;
}

.price {
color: #830314;
font-weight: bold;
font-size: 18px;
}

/* ボタン */
button {
padding: 10px;
background: #726868;
color: white;
border: none;
cursor: pointer;
border-radius: 5px;
}

button:hover {
opacity: 0.85;
}

/* 商品追加ボタン */
.product button {
width: 100%;
margin-top: 10px;
}

/* カート */
#cartArea {
background: white;
max-width: 700px;
margin: 20px auto;
padding: 20px;
border-radius: 12px;
}

/* カート1行 */
.cart-item {
display: flex;
align-items: center;
gap: 15px;
padding: 15px 0;
border-bottom: 1px solid #ddd;
}

.cart-item img {
width: 80px;
border-radius: 10px;
}

.cart-info {
flex: 1;
text-align: left;
}

.qty {
display: flex;
align-items: center;
gap: 8px;
margin-top: 8px;
}

.qty button {
width: 32px;
height: 32px;
padding: 0;
}

.total-box {
margin-top: 20px;
text-align: right;
font-size: 18px;
font-weight: bold;
}

.reset-btn {
margin-top: 15px;
}
</style>
</head>

<body>

<p>
つまみ細工の髪飾りです。<br>
七五三や成人式にどうぞ。
</p>

<h1>商品一覧</h1>

<div class="container">

<div class="product">
<img src="img1.jpg">
<p class="price">¥2,980</p>
<p>ヘアコーム<br>赤×桃</p>
<button type="button" onclick="addToCart('ヘアコーム<br>赤×桃')">カートに追加</button>
</div>

<div class="product">
<img src="img2.jpg">
<p class="price">¥2,980</p>
<p>ヘアコーム<br>桃×白</p>
<button type="button" onclick="addToCart('ヘアコーム<br>桃×白')">カートに追加</button>
</div>

<div class="product">
<img src="img3.jpg">
<p class="price">¥2,980</p>
<p>ヘアコーム<br>紺×白</p>
<button type="button" onclick="addToCart('ヘアコーム<br>紺×白')">カートに追加</button>
</div>

<div class="product">
<img src="img4.jpg">
<p class="price">¥1,980</p>
<p>ヘアクリップ<br>桃×白</p>
<button type="button" onclick="addToCart('ヘアクリップ<br>桃×白')">カートに追加</button>
</div>

<div class="product">
<img src="img5.jpg">
<p class="price">¥1,980</p>
<p>ヘアクリップ<br>桃×紫</p>
<button type="button" onclick="addToCart('ヘアクリップ<br>桃×紫')">カートに追加</button>
</div>

<div class="product">
<img src="img6.jpg">
<p class="price">¥1,980</p>
<p>ヘアクリップ<br>紫×白</p>
<button type="button" onclick="addToCart('ヘアクリップ<br>紫×白')">カートに追加</button>
</div>

</div>

<h2>カート：<span id="cartCount">0</span>個</h2>

<div id="cartArea"></div>

<button class="reset-btn" type="button" onclick="resetCart()">カートを空にする</button>

<p>
布地は正絹です。<br>水気や変形に弱いため、お取り扱いには十分ご注意ください。<br>
趣味のハンドメイド作品になります。<br>歪みなどにご理解いただける方のみご購入をお願いいたします。
</p>
<script>
const prices = {
"ヘアコーム<br>赤×桃": 2980,
"ヘアコーム<br>桃×白": 2980,
"ヘアコーム<br>紺×白": 2980,
"ヘアクリップ<br>桃×白": 1980,
"ヘアクリップ<br>桃×紫": 1980,
"ヘアクリップ<br>紫×白": 1980
};

const images = {
"ヘアコーム<br>赤×桃": "img1.jpg",
"ヘアコーム<br>桃×白": "img2.jpg",
"ヘアコーム<br>紺×白": "img3.jpg",
"ヘアクリップ<br>桃×白": "img4.jpg",
"ヘアクリップ<br>桃×紫": "img5.jpg",
"ヘアクリップ<br>紫×白": "img6.jpg"
};

let cart = JSON.parse(localStorage.getItem("cart")) || {};

showCart();

function addToCart(name) {
cart[name] = (cart[name] || 0) + 1;
saveCart();
}

function plusItem(name) {
cart[name]++;
saveCart();
}

function minusItem(name) {
cart[name]--;

if (cart[name] <= 0) {
delete cart[name];
}

saveCart();
}

function resetCart() {
cart = {};
localStorage.removeItem("cart");
showCart();
}

function saveCart() {
localStorage.setItem("cart", JSON.stringify(cart));
showCart();
}

function showCart() {
let text = "";
let totalCount = 0;
let totalPrice = 0;

for (let item in cart) {
let count = cart[item];
let price = prices[item];
let subtotal = count * price;

text += `
<div class="cart-item">
<img src="${images[item]}">

<div class="cart-info">
${item}<br>
¥${price.toLocaleString()}

<div class="qty">
<button type="button" onclick="minusItem('${item}')">−</button>
${count}
<button type="button" onclick="plusItem('${item}')">＋</button>
</div>

小計 ¥${subtotal.toLocaleString()}
</div>
</div>
`;

totalCount += count;
totalPrice += subtotal;
}

text += `
<div class="total-box">
合計個数：${totalCount}個<br>
合計金額：¥${totalPrice.toLocaleString()}
</div>
`;

document.getElementById("cartArea").innerHTML = text;
document.getElementById("cartCount").textContent = totalCount;
}
</script>

</body>
</html>
